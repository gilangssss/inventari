<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login - Peminjaman Inventaris</title><style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:#f1f1f4;padding:20px;color:#202820}.container{max-width:1200px;min-height:520px;margin:auto;background:#fff9ec;padding:30px;border-radius:20px;box-shadow:0 4px 15px #00000015}.navbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:30px}.menu{display:flex;align-items:center;gap:10px;background:#f2e5c9;padding:12px 18px;border-radius:15px;flex:1;flex-wrap:wrap}.menu a{color:#202820;text-decoration:none;font-weight:bold;padding:8px 10px;border-radius:9px}.menu a:hover,.menu a.active{background:#006633;color:white}.admin{font-weight:bold;white-space:nowrap}.admin a{color:inherit;text-decoration:none}.page-title{font-size:30px;margin-bottom:8px}.muted{color:#667066;margin-bottom:24px}.btn{display:inline-block;background:#006633;color:#fff;text-decoration:none;border:0;border-radius:9px;padding:11px 17px;font-weight:bold;cursor:pointer}.btn:hover{background:#004d26}.btn-light{background:#e5eadf;color:#164b2c}.btn-danger{background:#a83232}.table-wrapper{overflow-x:auto}table{width:100%;border-collapse:collapse;background:white}th,td{border:1px solid #c9c9c0;padding:13px 14px;text-align:center}th{background:#f2e5c9}td.actions{white-space:nowrap}.actions a,.actions button{margin:2px}.form-box{max-width:520px;margin:25px auto;background:#e4eee4;padding:28px;border-radius:18px}.form-group{margin-bottom:17px}label{display:block;font-weight:bold;margin-bottom:7px}input{width:100%;height:42px;border:1px solid #bdc8bd;border-radius:9px;padding:0 12px;font-size:15px;background:white}input:focus{outline:2px solid #7eaa8a;border-color:#006633}.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:35px}.stat{background:#f2e5c9;padding:22px;border-radius:15px}.stat strong{display:block;font-size:30px;color:#006633;margin-top:8px}.welcome-panel{background:#e4eee4;padding:35px;border-radius:18px;margin-top:25px}.welcome-panel h1{font-size:clamp(27px,4vw,42px);max-width:700px;line-height:1.15}.datetime{margin-top:20px;font-weight:bold;color:#31563b}.notice{margin-top:15px;color:#006633;font-weight:bold;min-height:20px}
@media(max-width:760px){body{padding:8px}.container{padding:17px}.navbar{align-items:stretch;flex-direction:column}.admin{padding:5px}.cards{grid-template-columns:1fr}.page-title{font-size:25px}.form-box{padding:20px}.form-actions{flex-wrap:wrap}}
body{min-height:100vh;display:grid;place-items:center}.login{width:100%;max-width:1200px;min-height:520px;background:#fff9ec;border-radius:20px;padding:35px;display:grid;place-items:center;box-shadow:0 4px 15px #00000015}.login-box{width:100%;max-width:420px}.logo{font-size:40px;margin-bottom:20px}.welcome{color:#006633;margin-bottom:7px}h1{font-size:34px;margin-bottom:22px}.login .form-group{margin-bottom:16px}.login button{width:100%;margin-top:10px}@media(max-width:600px){body{padding:10px}.login{padding:25px 18px}h1{font-size:28px}}</style></head><body><main class="login"><section class="login-box"><div class="logo">🌿</div><p class="welcome">Selamat datang kembali</p><h1>Masuk akun Anda</h1><form onsubmit="login(event)"><div class="form-group"><label for="email">Email</label><input id="email" type="email" placeholder="admin@gmail.com" required></div><div class="form-group"><label for="password">Kata sandi</label><input id="password" type="password" placeholder="Masukkan kata sandi" required></div><button class="btn" type="submit">MASUK KE DASHBOARD →</button><p class="notice" id="pesan"></p></form><small>Demo login: admin@gmail.com / admin123</small></section></main><script>function login(e){e.preventDefault();const email=document.getElementById('email').value;const pass=document.getElementById('password').value;if(email==='admin@gmail.com'&&pass==='admin123'){location.href='dashboard.html'}else{document.getElementById('pesan').textContent='Email atau kata sandi salah.'}}</script></body></html>
